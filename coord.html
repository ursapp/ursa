<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coordination — URSAPP</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/navbar.css" />
  <style>
    /* ============================================================
       Styles propres à coord.html
       ============================================================ */
    [hidden] { display: none !important; }

    /* Section "Classes" reprise telle quelle de pages/pp.html */
    .pp_table td, .pp_table th {
      padding: var(--space_1) var(--space_2);
      vertical-align: top;
      text-align: left;
    }
    .pp_table td:last-child, .pp_table th:last-child {
      text-align: center;
      vertical-align: middle;
    }

    /* Modale de connexion (profils "coord", indépendante de la connexion
       principale de l'app — voir onglet "coord" de la Sheet Paramètres) :
       grille d'initiales + mot de passe + "Rester connecté(e)", sur le
       même modèle que la modale de index.html. */
    .login_modal_overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(22, 38, 42, 0.82);
      z-index: 500;
      align-items: center;
      justify-content: center;
      padding: var(--space_6);
    }
    .login_modal_overlay.is_visible { display: flex; }
    .login_modal {
      background: var(--color_paper_raised);
      border-radius: var(--radius_md);
      width: 100%;
      max-width: 440px;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.32);
      padding: var(--space_6);
    }
    .login_modal_header h2 {
      margin: 0 0 var(--space_2) 0;
      font-family: var(--font_display);
      display: flex;
      align-items: center;
      gap: var(--space_2);
      justify-content: center;
    }
    .login_modal_note {
      font-size: var(--fs_sm);
      color: var(--text_secondary);
      margin: 0 0 var(--space_5) 0;
      font-style: italic;
      text-align: center;
    }
    .login_users_grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: var(--space_4);
      padding: 0 0 var(--space_5) 0;
    }
    .login_user_badge {
      width: 52px;
      height: 52px;
      font-size: var(--fs_md);
      box-shadow: 0 0 0 2px transparent;
      transition: box-shadow 120ms ease, transform 120ms ease, opacity 120ms ease;
    }
    .login_user_badge:not(.is_disabled):hover { transform: translateY(-2px); }
    .login_user_badge.is_selected {
      box-shadow: 0 0 0 3px var(--color_teal_light);
      background: var(--color_seal_light);
    }
    .login_user_badge.is_disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .login_user_badge.is_disabled:hover { background: var(--color_seal); }
    .login_password_form {
      display: flex;
      flex-direction: column;
      gap: var(--space_4);
      padding-top: var(--space_5);
      border-top: 1px solid var(--border_soft);
    }
    .login_password_form label {
      display: flex;
      flex-direction: column;
      gap: var(--space_2);
      font-size: var(--fs_sm);
      font-weight: 600;
      color: var(--text_secondary);
    }
    .login_password_form input[type="password"] {
      font-family: inherit;
      font-size: var(--fs_base);
      padding: var(--space_3);
      border: 1px solid var(--border_soft);
      border-radius: var(--radius_sm);
      background: var(--color_paper_raised);
      color: var(--text_primary);
      transition: outline-color 120ms ease;
    }
    .login_password_form input[type="password"]:focus {
      outline: 2px solid var(--color_teal_light);
      outline-offset: 1px;
    }
    .login_password_form input[type="password"]:disabled {
      background: var(--color_paper);
      color: var(--text_secondary);
      cursor: not-allowed;
    }
    .login_remember_row {
      display: flex !important;
      flex-direction: row !important;
      align-items: center;
      gap: var(--space_2);
      font-size: var(--fs_sm);
      font-weight: 400;
      color: var(--text_secondary);
      cursor: pointer;
      white-space: nowrap;
    }
    .login_remember_row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--color_seal);
      cursor: pointer;
    }
    .login_password_error {
      display: flex;
      align-items: center;
      gap: var(--space_2);
      color: var(--color_danger);
      font-size: var(--fs_sm);
      margin: 0;
    }
    .login_password_form_actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space_4);
      margin-top: var(--space_1);
    }
    .btn_login {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space_2);
      flex-shrink: 0;
      padding: var(--space_2) var(--space_5);
      border: none;
      border-radius: var(--radius_sm);
      background: var(--color_seal);
      color: var(--color_ink);
      font-family: inherit;
      font-size: var(--fs_sm);
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow_card);
      transition: background 120ms ease, transform 120ms ease;
    }
    .btn_login:hover { background: var(--color_seal_light); }
    .btn_login:active { transform: translateY(1px); }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="page_title_group">
      <span class="page_eyebrow">COORD · COORDINATION</span>
      <h1 class="page_title">Coordination</h1>
    </div>
    <div class="navbar_actions">
      <span class="user_badge" id="coord_user_badge">--</span>
      <button type="button" class="btn_logout_navbar" id="coord_btn_logout" hidden title="Se déconnecter">
        <i class="bi bi-box-arrow-right"></i>
      </button>
    </div>
  </header>

  <main class="app_content app_content_metier">

    <!-- ============================================================
         Section "Classes" — reprise à l'identique de la section #classes
         de pages/pp.html (même structure, mêmes colonnes, même logique
         de chargement via listClassesPP). Masquée tant que l'utilisateur
         n'est pas connecté ; une fois connecté, ne montre que les classes
         correspondant à son Etablissement et à ses Classes (onglet "coord").
         "Afficher" importe la classe depuis Drive en ouvrant pages/class.html
         (classes FAD classiques) ou pages/pfe.html (classes de niveau 6/6),
         avec ?gclasse=<id> — même bascule que pp.html (voir renderPPClasseTable
         ci-dessous), sans toutefois permettre la création (pas de bouton
         "Nouvelle classe" ici : réservé à pp.html).
         ============================================================ -->
    <section id="classes" class="panel" hidden>
      <div class="panel_header">
        <h2><i class="bi bi-book"></i> Mes classes</h2>
      </div>

      <table class="data_table pp_table">
        <thead>
          <tr>
            <th>Classe</th>
            <th>Début</th>
            <th>Fin</th>
            <th>Facturation</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="pp_classe_table_body"></tbody>
      </table>
      <div class="empty_state" id="pp_classe_empty" hidden>
        <i class="bi bi-inbox"></i>Aucune classe enregistrée.
      </div>
    </section>

  </main>

  <div class="login_modal_overlay" id="coord_login_modal">
    <div class="login_modal">
      <div class="login_modal_header">
        <h2><i class="bi bi-person-circle"></i> Qui êtes-vous ?</h2>
        <p class="login_modal_note">Choisissez votre profil et saisissez votre mot de passe.</p>
      </div>
      <div class="login_users_grid" id="coord_login_users_grid">
        <p class="loading_state">Chargement...</p>
      </div>

      <form class="login_password_form" id="coord_login_form">
        <label>Mot de passe
          <input type="password" id="coord_login_password" autocomplete="current-password" disabled required />
        </label>
        <p class="login_password_error" id="coord_login_error" hidden></p>
        <div class="login_password_form_actions">
          <label class="login_remember_row">
            <input type="checkbox" id="coord_login_remember" /> Rester connecté(e)
          </label>
          <button type="submit" class="btn_login"><i class="bi bi-box-arrow-in-right"></i> Se connecter</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script>
/* ============================================================
   COORD.JS
   Connexion indépendante de la session principale de l'app (onglet
   "coord" de la Sheet Paramètres : Initiales | Nom | M2p | Etablissement
   | Classes), stockée sous une clé de session distincte pour ne pas
   interférer avec urs_current_user (index.html / pages/*.html). Une
   fois connecté, la section "Classes" (copie de celle de pp.html) est
   affichée, filtrée aux classes dont le nom contient l'Etablissement
   ET les Classes du profil connecté (ex. Etablissement "ISETS", Classes
   "LATI Pr" -> ne montre que "ISETS LATI Pr2 4-6 1-2026" et similaires).
   Etablissement/Classes peuvent contenir plusieurs valeurs séparées par
   ";" (correspondance si au moins une valeur de chaque colonne matche).
   ============================================================ */

const COORD_SESSION_KEY = "urs_coord_user";
let coordUsers = [];
let coordUser = null;
let coordUtilisateurSelectionne = null;
let ppClasseListCache = [];

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("coord_btn_logout").addEventListener("click", deconnecterCoord);
  document.getElementById("coord_login_form").addEventListener("submit", onSubmitLogin);

  coordUser = getCoordUser();
  mettreAJourEtatConnexion();
  if (!coordUser) {
    ouvrirModaleConnexion();
  } else {
    afficherClasses();
  }
});

/* ---------------- Session coord (indépendante de session.js) ----------------
   "Rester connecté(e)" détermine où la session est mémorisée : coché ->
   localStorage (persiste après fermeture du navigateur), décoché ->
   sessionStorage (effacé à la fermeture de l'onglet). getCoordUser()
   regarde les deux (localStorage en priorité). */

function getCoordUser() {
  try {
    const brut = localStorage.getItem(COORD_SESSION_KEY) || sessionStorage.getItem(COORD_SESSION_KEY);
    return brut ? JSON.parse(brut) : null;
  } catch (err) {
    return null;
  }
}

function setCoordUser(user, resterConnecte) {
  const { M2p, ...sansMotDePasse } = user;
  const valeur = JSON.stringify(sansMotDePasse);
  if (resterConnecte) {
    localStorage.setItem(COORD_SESSION_KEY, valeur);
    sessionStorage.removeItem(COORD_SESSION_KEY);
  } else {
    sessionStorage.setItem(COORD_SESSION_KEY, valeur);
    localStorage.removeItem(COORD_SESSION_KEY);
  }
  coordUser = sansMotDePasse;
}

function deconnecterCoord() {
  localStorage.removeItem(COORD_SESSION_KEY);
  sessionStorage.removeItem(COORD_SESSION_KEY);
  coordUser = null;
  document.getElementById("classes").hidden = true;
  mettreAJourEtatConnexion();
  ouvrirModaleConnexion();
}

function initialesCoordUser(user) {
  if (!user) return "?";
  if (user.Initiales) return user.Initiales;
  if (user.Nom) {
    return user.Nom.trim().split(/\s+/).map((mot) => mot[0]).join("").toUpperCase().slice(0, 2);
  }
  return "?";
}

function mettreAJourEtatConnexion() {
  const badge = document.getElementById("coord_user_badge");
  badge.textContent = initialesCoordUser(coordUser);
  document.getElementById("coord_btn_logout").hidden = !coordUser;
}

/* ---------------- Modale de connexion (grille d'initiales) ---------------- */

function ouvrirModaleConnexion() {
  document.getElementById("coord_login_modal").classList.add("is_visible");
  reinitialiserFormulaireConnexion();
  chargerProfilsConnexion();
}

function reinitialiserFormulaireConnexion() {
  coordUtilisateurSelectionne = null;
  document.getElementById("coord_login_password").value = "";
  document.getElementById("coord_login_password").disabled = true;
  document.getElementById("coord_login_error").hidden = true;
  document.getElementById("coord_login_remember").checked = false;
}

async function chargerProfilsConnexion() {
  const grid = document.getElementById("coord_login_users_grid");
  grid.innerHTML = `<p class="loading_state">Chargement...</p>`;
  try {
    coordUsers = await apiCall("listUsersCoord", {});

    if (!coordUsers.length) {
      grid.innerHTML = `<p>Aucun utilisateur configuré (onglet "coord" de Paramètres).</p>`;
      return;
    }

    grid.innerHTML = coordUsers.map((u, i) => {
      const aAcces = String(u.M2p || "").trim() !== "";
      return `
      <button type="button" class="user_badge login_user_badge ${aAcces ? "" : "is_disabled"}"
              data-index="${i}" ${aAcces ? "" : "disabled"}
              title="${aAcces ? (u.Nom || "") : "Accès non configuré"}">
        ${initialesCoordUser(u)}
      </button>`;
    }).join("");

    grid.querySelectorAll(".login_user_badge:not(.is_disabled)").forEach((btn) => {
      btn.addEventListener("click", () => selectionnerProfilConnexion(coordUsers[Number(btn.dataset.index)], btn));
    });
  } catch (err) {
    grid.innerHTML = `<p class="error_state">Erreur : ${err.message}</p>`;
  }
}

function selectionnerProfilConnexion(user, btn) {
  coordUtilisateurSelectionne = user;
  document.getElementById("coord_login_error").hidden = true;
  document.querySelectorAll("#coord_login_users_grid .login_user_badge").forEach((b) => b.classList.remove("is_selected"));
  btn.classList.add("is_selected");
  const champMotDePasse = document.getElementById("coord_login_password");
  champMotDePasse.disabled = false;
  champMotDePasse.focus();
}

function onSubmitLogin(e) {
  e.preventDefault();
  const user = coordUtilisateurSelectionne;
  const passwordInput = document.getElementById("coord_login_password");
  const errorEl = document.getElementById("coord_login_error");

  if (!user) {
    errorEl.textContent = "Choisissez d'abord votre profil ci-dessus.";
    errorEl.hidden = false;
    return;
  }
  if (String(passwordInput.value) !== String(user.M2p || "")) {
    errorEl.textContent = "Mot de passe incorrect.";
    errorEl.hidden = false;
    return;
  }

  const resterConnecte = document.getElementById("coord_login_remember").checked;
  setCoordUser(user, resterConnecte);
  mettreAJourEtatConnexion();
  document.getElementById("coord_login_modal").classList.remove("is_visible");
  afficherClasses();
}

function afficherClasses() {
  document.getElementById("classes").hidden = false;
  loadPPClasses();
}

/* ---------------- Tableau des classes (repris de pp.html) ---------------- */

async function loadPPClasses() {
  const tbody = document.getElementById("pp_classe_table_body");
  tbody.innerHTML = `<tr class="table_state_row"><td colspan="5"><span class="loading_state">Chargement...</span></td></tr>`;

  try {
    ppClasseListCache = await apiCall("listClassesPP", {});
    renderPPClasseTable();
  } catch (err) {
    tbody.innerHTML = `<tr class="table_state_row"><td colspan="5"><span class="error_state">Erreur de chargement : ${err.message}</span></td></tr>`;
  }
}

// Filtre les classes selon le profil coord connecté : le nom de fichier
// (nomenclature "<Sigle>_<Classe>_Pr<promotion>_<niveau>_<semestre>", ex.
// "ISETS LATI Pr2 4-6 1-2026" une fois les "_" remplacés par des espaces)
// doit contenir au moins une valeur de la colonne Etablissement (le Sigle,
// ex. "ISETS") ET au moins une valeur de la colonne Classes (ex. "LATI Pr").
function classeVisiblePourCoordUser(nomClasse) {
  if (!coordUser) return false;
  const nom = (nomClasse || "").toLowerCase();

  const decouper = (valeur) => String(valeur || "")
    .split(";")
    .map((s) => s.trim().toLowerCase())
    .filter(Boolean);

  const etablissements = decouper(coordUser["Etablissement"]);
  const classes = decouper(coordUser["Classes"]);

  const etablissementOk = etablissements.length === 0 || etablissements.some((e) => nom.includes(e));
  const classeOk = classes.length === 0 || classes.some((c) => nom.includes(c));
  return etablissementOk && classeOk;
}

function renderPPClasseTable() {
  const tbody = document.getElementById("pp_classe_table_body");
  const emptyEl = document.getElementById("pp_classe_empty");

  // Nomenclature Drive : "<Sigle>_<Classe>_Pr<promotion>_<niveau>_<semestre>"
  // (voir nomFichierClasse() côté Code.gs, seule source de vérité pour le
  // nom du fichier).
  const nomClasse = (c) => {
    let name = (c.name || "").replace(/\.html?$/i, "").replace(/_/g, " ");
    // Afficher le niveau avec "/" : X-Y -> X/Y (ex. 4-6 -> 4/6),
    // le semestre final (ex. 1-2026) reste inchangé.
    name = name.replace(/(\d)-(\d)(?=\s|$)/, "$1/$2");
    return name;
  };

  // Une classe de niveau "6/6" (dernière année de licence, mémoire de fin
  // d'études) s'ouvre dans pfe.html au lieu de class.html — même logique
  // que pages/pp.html. On se base sur le champ "Niveau" du récap (voir
  // listClassesPP() côté Code.gs), avec repli sur le nom de fichier
  // (…_6-6_…, "/" y étant remplacé par "-", cf. nomFichierClasse() côté
  // Code.gs) si ce champ n'est pas renvoyé par le backend. class.html /
  // pfe.html importent ensuite eux-mêmes la classe depuis Drive via ce
  // paramètre "gclasse" (chargerClasse) : coord.html ne fait qu'y rediriger.
  const estNiveau6sur6 = (c) => (c["Niveau"] || "").trim() === "6/6" || /_6-6_/.test(c.name || "");
  const urlClasse = (c) => `pages/${estNiveau6sur6(c) ? "pfe.html" : "class.html"}?gclasse=${c.id}`;

  const filtered = ppClasseListCache
    .filter((c) => classeVisiblePourCoordUser(nomClasse(c)))
    .sort((a, b) => nomClasse(a).localeCompare(nomClasse(b), "fr", { numeric: true, sensitivity: "base" }));


  if (filtered.length === 0) {
    tbody.innerHTML = "";
    if (emptyEl) emptyEl.hidden = false;
    return;
  }
  if (emptyEl) emptyEl.hidden = true;

  tbody.innerHTML = filtered.map((c) => `
    <tr>
      <td>${nomClasse(c)}</td>
      <td>${c["Début"] || ""}</td>
      <td>${c["Fin"] || ""}</td>
      <td>—</td>
      <td>
        <a class="btn_info" href="${urlClasse(c)}">
          <i class="bi bi-eye"></i> Afficher
        </a>
      </td>
    </tr>`).join("");
}
  </script>
</body>
</html>
